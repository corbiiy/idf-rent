name: Crawl rentals

# The regular crawl runs on Railway (scraper/worker.py). This workflow is kept for
# manual runs and webhook tests; uncomment the schedule to crawl from GitHub again.
on:
  # schedule:
  #   - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      departments:
        description: "Comma-separated IDF department codes (default: all 8)"
        required: false
        default: "75,77,78,91,92,93,94,95"
      test_alert:
        description: "Post the 3 latest matching listings to Discord instead of only new ones"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start from the latest data branch copy
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch origin data
            git show origin/data:data/listings.json > data/listings.json
          fi

      - name: Crawl, re-check liveness, notify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEPARTMENTS: ${{ github.event.inputs.departments || '75,77,78,91,92,93,94,95' }}
          TEST_ALERT: ${{ github.event.inputs.test_alert || 'false' }}
        run: |
          if [ "$TEST_ALERT" = "true" ]; then
            python -m scraper --departments "$DEPARTMENTS" --notify-test
          else
            python -m scraper --departments "$DEPARTMENTS" --notify
          fi

      - name: Commit data to the data branch
        run: |
          git config user.name "idf-rent bot"
          git config user.email "idf-rent-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch origin data
            git worktree add ../data-wt origin/data
          else
            git worktree add -b data ../data-wt
          fi
          mkdir -p ../data-wt/data
          cp data/listings.json ../data-wt/data/listings.json
          cd ../data-wt
          git add data/listings.json
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "data: crawl $(date -u +%Y-%m-%dT%H:%MZ) (actions)"
          git push origin HEAD:data
