name: Crawl rentals

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      departments:
        description: "Comma-separated IDF department codes (default: all 8)"
        required: false
        default: "75,77,78,91,92,93,94,95"
      test_alert:
        description: "Post the 3 latest matching listings to Discord instead of only new ones"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write   # to dispatch pages.yml after a data commit

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Crawl, re-check liveness, notify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEPARTMENTS: ${{ github.event.inputs.departments || '75,77,78,91,92,93,94,95' }}
          TEST_ALERT: ${{ github.event.inputs.test_alert || 'false' }}
        run: |
          if [ "$TEST_ALERT" = "true" ]; then
            python -m scraper --departments "$DEPARTMENTS" --notify-test
          else
            python -m scraper --departments "$DEPARTMENTS" --notify
          fi

      - name: Commit data changes
        run: |
          git config user.name "idf-rent bot"
          git config user.email "idf-rent-bot@users.noreply.github.com"
          git add data/listings.json
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "data: crawl $(date -u +%Y-%m-%dT%H:%MZ)"
          # another run may have pushed meanwhile; rebase our single data commit on top
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
          # pushes made with GITHUB_TOKEN never trigger other workflows, so deploy explicitly
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
